<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburbur Data</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
            padding: 8px 13px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #f0f0f0;
        }

        button:active {
            transform: translateY(1px);
        }

        #status {
            padding: 8px 18px;
            font-size: 13px;
            color: #666;
            border-bottom: 1px solid #eee;
        }

        pre {
            margin: 0;
            padding: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.55;
        }

        .string {
            color: #008000;
        }

        .number {
            color: #0066cc;
        }

        .boolean {
            color: #aa00aa;
        }

        .null {
            color: #777;
        }

        .key {
            color: #7a3e00;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="title">Hamburbur Data</div>

        <div class="buttons">
            <button onclick="prettyPrint()">Pretty Print</button>
            <button onclick="copyJSON()">Copy</button>
            <button onclick="reloadData()">Reload</button>
        </div>
    </div>

    <div id="status">Loading data...</div>

    <pre id="output"></pre>

    <script>
        const DATA_URL = "https://hamburbur.org/data";

        let rawData = null;
        let pretty = true;

        async function loadData() {
            const status = document.getElementById("status");
            const output = document.getElementById("output");

            status.textContent = "Loading data...";

            try {
                const response = await fetch(DATA_URL);

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                rawData = await response.json();

                render();

                status.textContent =
                    "Loaded successfully • " +
                    JSON.stringify(rawData).length.toLocaleString() +
                    " characters";

            } catch (error) {
                status.textContent = "Failed to load data";

                output.textContent =
                    "Could not load the data.\n\n" +
                    error.message;
            }
        }

        function render() {
            const output = document.getElementById("output");

            if (pretty) {
                output.innerHTML = syntaxHighlight(
                    JSON.stringify(rawData, null, 4)
                );
            } else {
                output.textContent = JSON.stringify(rawData);
            }
        }

        function prettyPrint() {
            if (!rawData) return;

            pretty = !pretty;
            render();

            document.querySelector(
                'button[onclick="prettyPrint()"]'
            ).textContent = pretty
                ? "Pretty Print"
                : "Compact";
        }

        async function copyJSON() {
            if (!rawData) return;

            const text = pretty
                ? JSON.stringify(rawData, null, 4)
                : JSON.stringify(rawData);

            try {
                await navigator.clipboard.writeText(text);

                const button = document.querySelector(
                    'button[onclick="copyJSON()"]'
                );

                const oldText = button.textContent;
                button.textContent = "Copied!";

                setTimeout(() => {
                    button.textContent = oldText;
                }, 1200);

            } catch {
                alert("Could not copy the JSON.");
            }
        }

        function reloadData() {
            loadData();
        }

        function syntaxHighlight(json) {
            json = json
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            return json.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
                function (match) {

                    let cls = "number";

                    if (/^"/.test(match)) {
                        cls = /:$/.test(match)
                            ? "key"
                            : "string";
                    } else if (/true|false/.test(match)) {
                        cls = "boolean";
                    } else if (/null/.test(match)) {
                        cls = "null";
                    }

                    return '<span class="' +
                        cls +
                        '">' +
                        match +
                        "</span>";
                }
            );
        }

        loadData();
    </script>

</body>
</html>
